[project]
name = "vgi-odata-notebooks"
version = "0.1.0"
description = "Paging and status populations with the released OData worker"
requires-python = ">=3.13,<3.15"
dependencies = ["vgi-example-notebooks[runner] @ git+https://github.com/Query-farm/vgi-example-notebooks@v0.3.49"]

[tool.ruff]
builtins = ["declarations", "retained", "categories", "totals", "checks", "registry", "status", "selected"]
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]
"synthetic_odata.py" = ["E501"]  # Preserve the original published fixture helper byte-for-byte.

[tool.ruff.format]
exclude = ["synthetic_odata.py"]
