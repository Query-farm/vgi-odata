name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

env:
  # The SQL test runner, pinned like the vgi-starter's (Makefile HAYBARN_VERSION).
  HAYBARN_VERSION: "2.0.0rc11"

jobs:
  build-test:
    name: Build, vet, fmt, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

  # SQL end-to-end: test/sql/*.test through the published haybarn-unittest
  # runner and the signed community `vgi` extension, over each transport
  # (stdio, launch = DuckDB-managed AF_UNIX socket, http). ci/run-integration.sh
  # (adapted from the vgi-starter) starts the repo's mock backend and fails on
  # any unexpected skip.
  integration:
    name: SQL E2E (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, launch, http]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Build the worker
        run: go build -o vgi-odata-worker ./cmd/vgi-odata-worker

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          WORKER="$PWD/vgi-odata-worker" HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest" \
            TRANSPORT=${{ matrix.transport }} ci/run-integration.sh

  # Metadata quality: build the worker, then run the vgi-lint metadata-quality
  # linter against it. The linter force-installs the signed `vgi` community
  # extension itself and inspects the catalog/schema/function metadata the
  # worker advertises. Kept as a separate job so the score is visible.
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build the worker
        run: go build -o vgi-odata-worker ./cmd/vgi-odata-worker

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: "${{ github.workspace }}/vgi-odata-worker"
          fail-on: info
